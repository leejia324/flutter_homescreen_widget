name: flutter_homescreen_widget
description: >-
  Update iOS WidgetKit and Android Glance home screen widgets using Flutter
  widgets as the UI. Design your widget in pure Dart — no Swift or Kotlin
  required. Supports tap actions, multiple widget sizes, and auto-sync.
version: 0.1.0
homepage: https://github.com/leejia324/flutter_homescreen_widget
repository: https://github.com/leejia324/flutter_homescreen_widget
issue_tracker: https://github.com/leejia324/flutter_homescreen_widget/issues

environment:
  sdk: ^3.11.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.leejia.flutter_homescreen_widget
        pluginClass: FlutterHomescreenWidgetPlugin
      ios:
        pluginClass: FlutterHomescreenWidgetPlugin
